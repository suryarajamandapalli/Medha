<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Medha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <div class="container py-5 text-center">
        <h1 class="display-4 fw-bold">Welcome to Medha!</h1>
        <p class="lead">You have successfully logged in and completed your profile.</p>
        <div class="alert alert-success d-inline-block">Auth Flow Verified ✅</div>
        <br>
        <button onclick="logout()" class="btn btn-outline-danger mt-4">Log Out</button>
    </div>

    <script type="module">
        import { auth, signOut } from "./js/firebase-config.js";

        window.logout = async () => {
            await signOut(auth);
            window.location.href = 'index.html';
        };
    </script>
</body>

</html>
