<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Medha</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="text-center p-5 bg-white rounded-4 shadow-sm" style="max-width: 500px;">
        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-4"
            style="width: 80px; height: 80px; font-size: 2rem;">
            <i class="bi bi-envelope-check"></i>
        </div>
        <h2 class="fw-bold mb-3">Check your email</h2>
        <p class="text-muted mb-4">
            We've sent a verification link to your email address. Please click the link to activate your account and
            start learning.
        </p>

        <div class="d-grid gap-3">
            <a href="login.html" class="btn btn-primary btn-lg rounded-pill">Back to Login</a>
            <button onclick="resendEmail()" class="btn btn-link text-decoration-none text-muted">Resend Link</button>
        </div>
    </div>

    <!-- Firebase SDKs are imported inside the module -->
    <script type="module">
        import { auth, sendEmailVerification } from "./js/firebase-config.js";

        window.resendEmail = async function() {
            const user = auth.currentUser;
            if (user) {
                try {
                    await sendEmailVerification(user);
                    alert("Verification email resent!");
                } catch (error) {
                    console.error("Resend verification error:", error);
                    alert("Error resending verification: " + error.message);
                }
            } else {
                alert("Please log in first to resend verification.");
                window.location.href = "login.html";
            }
        }
    </script>
</body>

</html>
